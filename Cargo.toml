[package]
name = "cron-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PEPAI <pep_ai@icloud.com>"]
description = "Read-only audit of crontab and systemd-timer schedules against syslog/journal evidence"
repository = "https://github.com/qwpp7g79y4-maker/cron-ledger"
readme = "README.md"
keywords = ["cron", "crontab", "systemd", "syslog", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", ".gitattributes"]

[dependencies]
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[dev-dependencies]
proptest = "1.11.0"
assert_cmd = "2"

[lib]
name = "cron_ledger"
path = "src/lib.rs"

[[bin]]
name = "cron-ledger"
path = "src/main.rs"
