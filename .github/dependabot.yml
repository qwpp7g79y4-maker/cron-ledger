version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Security updates only (repo setting); no version-update PRs.
    open-pull-requests-limit: 0
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
